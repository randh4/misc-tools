<div class="row g-4">
  <!-- RAID Calculator -->
  <div class="col-md-6" id="tool-raid">
    <div class="card h-100 tool-card">
      <div class="card-header fw-bold">RAID Storage Calculator</div>
      <div class="card-body">
        <div class="row g-2 mb-2">
          <div class="col-4">
            <select class="form-select mono" id="raid-level">
              <option value="0">RAID 0</option>
              <option value="1">RAID 1</option>
              <option value="5" selected>RAID 5</option>
              <option value="6">RAID 6</option>
              <option value="10">RAID 10</option>
            </select>
          </div>
          <div class="col-4">
            <input type="number" class="form-control mono" id="raid-size" placeholder="GB size" value="1000">
          </div>
          <div class="col-4">
            <input type="number" class="form-control mono" id="raid-count" placeholder="Disks" value="4">
          </div>
        </div>
        <button class="btn btn-primary btn-sm mb-2" id="btn-raid-calc">Calculate</button>
        <pre class="bg-body-tertiary p-2 rounded small mono mb-0" id="raid-res">Capacity info...</pre>
      </div>
    </div>
  </div>

  <!-- SLA Calculator -->
  <div class="col-md-6" id="tool-sla">
    <div class="card h-100 tool-card">
      <div class="card-header fw-bold">SLA / Uptime Downtime Calculator</div>
      <div class="card-body">
        <div class="input-group mb-2">
          <input type="number" step="0.01" class="form-control mono" id="sla-pct" value="99.9">
          <span class="input-group-text">%</span>
          <button class="btn btn-primary btn-sm" id="btn-sla-calc">Calculate</button>
        </div>
        <pre class="bg-body-tertiary p-2 rounded small mono mb-0" id="sla-res">Allowed downtime...</pre>
      </div>
    </div>
  </div>

  <!-- Bandwidth Calculator -->
  <div class="col-md-6" id="tool-bw">
    <div class="card h-100 tool-card">
      <div class="card-header fw-bold">Bandwidth & Transfer Time Calculator</div>
      <div class="card-body">
        <div class="row g-2 mb-2">
          <div class="col-6">
            <input type="number" class="form-control mono" id="bw-size" placeholder="Size (MB)" value="1024">
          </div>
          <div class="col-6">
            <input type="number" class="form-control mono" id="bw-speed" placeholder="Speed (Mbps)" value="100">
          </div>
        </div>
        <button class="btn btn-primary btn-sm mb-2" id="btn-bw-calc">Calculate Time</button>
        <pre class="bg-body-tertiary p-2 rounded small mono mb-0" id="bw-res">Estimated time...</pre>
      </div>
    </div>
  </div>

  <!-- Chmod Calculator -->
  <div class="col-md-6" id="tool-chmod">
    <div class="card h-100 tool-card">
      <div class="card-header fw-bold">POSIX Chmod Calculator</div>
      <div class="card-body">
        <div class="input-group mb-2">
          <input type="text" class="form-control mono" id="chmod-octal" value="755" maxlength="3">
          <button class="btn btn-primary btn-sm" id="btn-chmod-calc">Calculate</button>
        </div>
        <pre class="bg-body-tertiary p-2 rounded small mono mb-0" id="chmod-res">Permissions...</pre>
      </div>
    </div>
  </div>

  <!-- Docker Compose to Run -->
  <div class="col-md-6" id="tool-docker">
    <div class="card h-100 tool-card">
      <div class="card-header fw-bold">Docker Compose to Shell Run</div>
      <div class="card-body">
        <textarea class="form-control mono mb-2" id="docker-yml" rows="3" placeholder="services:&#10;  web:&#10;    image: nginx&#10;    ports:&#10;      - '80:80'"></textarea>
        <button class="btn btn-primary btn-sm mb-2" id="btn-docker-conv">Convert</button>
        <input type="text" class="form-control mono" id="docker-res" readonly placeholder="docker run command">
      </div>
    </div>
  </div>

  <!-- YAML JSON Converter -->
  <div class="col-md-6" id="tool-yaml">
    <div class="card h-100 tool-card">
      <div class="card-header fw-bold">YAML ↔ JSON Converter</div>
      <div class="card-body">
        <textarea class="form-control mono mb-2" id="yj-in" rows="2" placeholder="key: value"></textarea>
        <div class="d-flex gap-2 mb-2">
          <button class="btn btn-outline-primary btn-sm" id="btn-y2j">YAML to JSON</button>
          <button class="btn btn-outline-secondary btn-sm" id="btn-j2y">JSON to YAML</button>
        </div>
        <textarea class="form-control mono" id="yj-out" rows="2" readonly placeholder="Output"></textarea>
      </div>
    </div>
  </div>

  <!-- Epoch Timestamp -->
  <div class="col-md-12" id="tool-epoch">
    <div class="card tool-card">
      <div class="card-header fw-bold">Log Timestamp & Epoch Converter</div>
      <div class="card-body">
        <div class="input-group mb-2">
          <input type="text" class="form-control mono" id="epoch-input" placeholder="1710000000 or 2024-03-09T12:00:00Z">
          <button class="btn btn-primary btn-sm" id="btn-epoch-conv">Convert</button>
        </div>
        <pre class="bg-body-tertiary p-2 rounded small mono mb-0" id="epoch-res">Timestamp details...</pre>
      </div>
    </div>
  </div>
</div>
