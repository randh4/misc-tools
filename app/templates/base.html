<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Engineer Toolbox</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="/">🛠️ IT Toolbox</a>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-secondary btn-sm" type="button" data-bs-toggle="modal" data-bs-target="#searchModal">
          Search <kbd class="ms-1">Ctrl+K</kbd>
        </button>
        <button class="btn btn-outline-secondary btn-sm" id="theme-toggle" type="button">🌓</button>
      </div>
    </div>
  </nav>

  <main class="container-fluid px-4 py-4">
    {% block content %}{% endblock %}
  </main>

  <div class="modal fade" id="searchModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <input type="text" class="form-control form-control-lg" id="global-search-input" placeholder="Search tool (e.g. subnet, jwt, ssl)...">
        </div>
        <div class="modal-body">
          <div class="list-group list-group-flush" id="search-results">
            <div class="text-muted p-2">Ketik nama alat untuk mencari...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="border-top py-3 text-center text-muted small">
    Stateless • Client-Side First • Zero Database
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/tools.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
